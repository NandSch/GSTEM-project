<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 810" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#111"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="810" fill="#f8fafc"/>

  <!-- Board -->
  <rect x="30" y="30" width="900" height="660" rx="18" fill="#14532d" stroke="#0a2e1a" stroke-width="4"/>
  <rect x="42" y="42" width="876" height="636" rx="14" fill="none" stroke="#22c55e" stroke-width="1" stroke-dasharray="6 6" opacity="0.6"/>

  <!-- Mounting holes -->
  <g fill="#f8fafc" stroke="#334155" stroke-width="2">
    <circle cx="75" cy="75" r="15"/>
    <circle cx="885" cy="75" r="15"/>
    <circle cx="75" cy="645" r="15"/>
    <circle cx="885" cy="645" r="15"/>
  </g>
  <g fill="#334155" font-size="10" text-anchor="middle">
    <text x="75" y="79">M3</text><text x="885" y="79">M3</text>
    <text x="75" y="649">M3</text><text x="885" y="649">M3</text>
  </g>

  <!-- Power section -->
  <rect x="60" y="100" width="235" height="180" rx="10" fill="#1f2937" stroke="#38bdf8" stroke-width="2"/>
  <text x="177" y="126" fill="#7dd3fc" font-size="14" font-weight="bold" text-anchor="middle">VOEDING</text>
  <g fill="#e2e8f0" font-size="11.5">
    <text x="74" y="150">J1 · accu 7,4 V / barrel</text>
    <text x="74" y="170">zekering + ompoolbeveiliging</text>
    <text x="74" y="190">buck-converter -&gt; 5 V</text>
    <text x="74" y="210">LDO -&gt; 3,3 V</text>
    <text x="74" y="230">decoupling 100 nF / rail</text>
    <text x="74" y="250">power-LED + serieweerstand</text>
  </g>
  <!-- LED symbol -->
  <circle cx="262" cy="246" r="7" fill="#facc15" stroke="#a16207" stroke-width="1.5"/>

  <!-- ESP32 module -->
  <rect x="340" y="95" width="270" height="215" rx="10" fill="#111827" stroke="#f59e0b" stroke-width="2"/>
  <text x="475" y="122" fill="#fbbf24" font-size="14" font-weight="bold" text-anchor="middle">ESP32-S3 breakout</text>
  <text x="475" y="140" fill="#cbd5e1" font-size="10.5" text-anchor="middle">centrale microcontroller + USB</text>
  <!-- header rows -->
  <rect x="352" y="155" width="16" height="130" rx="3" fill="#6b7280"/>
  <rect x="582" y="155" width="16" height="130" rx="3" fill="#6b7280"/>
  <g fill="#9ca3af" font-size="9">
    <text x="360" y="300" text-anchor="middle" transform="rotate(-90 360 300)">male pins in female socket</text>
    <text x="590" y="300" text-anchor="middle" transform="rotate(-90 590 300)">male pins in female socket</text>
  </g>
  <text x="475" y="185" fill="#e2e8f0" font-size="11" text-anchor="middle">Leest: IMU · baro · GNSS</text>
  <text x="475" y="205" fill="#e2e8f0" font-size="11" text-anchor="middle">Bundelt + sensorfusie (Kalman)</text>
  <text x="475" y="225" fill="#e2e8f0" font-size="11" text-anchor="middle">LoRa zenden/ontvangen</text>
  <text x="475" y="245" fill="#e2e8f0" font-size="11" text-anchor="middle">CSV naar controller</text>
  <text x="475" y="275" fill="#f59e0b" font-size="10" text-anchor="middle">heatsink</text>
  <rect x="400" y="282" width="150" height="18" rx="3" fill="#334155" stroke="#f59e0b" stroke-dasharray="3 3"/>

  <!-- LoRa module -->
  <rect x="655" y="95" width="180" height="130" rx="10" fill="#111827" stroke="#a78bfa" stroke-width="2"/>
  <text x="745" y="122" fill="#c4b5fd" font-size="13" font-weight="bold" text-anchor="middle">LoRa-radio</text>
  <text x="745" y="140" fill="#cbd5e1" font-size="10.5" text-anchor="middle">SX1276 / RFM95</text>
  <text x="745" y="158" fill="#cbd5e1" font-size="10.5" text-anchor="middle">868 MHz (EU)</text>
  <!-- antenna keepout -->
  <rect x="848" y="80" width="52" height="170" rx="6" fill="none" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="874" y="175" fill="#f9a8d4" font-size="10" text-anchor="middle" transform="rotate(90 874 175)">ANTENNE KEEP-OUT</text>

  <!-- IMU -->
  <rect x="345" y="360" width="180" height="115" rx="10" fill="#111827" stroke="#4ade80" stroke-width="2"/>
  <text x="435" y="386" fill="#86efac" font-size="13" font-weight="bold" text-anchor="middle">9-DoF IMU</text>
  <text x="435" y="404" fill="#cbd5e1" font-size="10.5" text-anchor="middle">BNO055 (kandidaat)</text>
  <text x="435" y="422" fill="#cbd5e1" font-size="10.5" text-anchor="middle">oriëntatie · beweging</text>
  <text x="435" y="440" fill="#cbd5e1" font-size="10.5" text-anchor="middle">I2C</text>
  <text x="435" y="462" fill="#86efac" font-size="10" text-anchor="middle">trillingsdemping</text>

  <!-- Barometer -->
  <rect x="555" y="360" width="160" height="115" rx="10" fill="#111827" stroke="#4ade80" stroke-width="2"/>
  <text x="635" y="386" fill="#86efac" font-size="13" font-weight="bold" text-anchor="middle">Barometer</text>
  <text x="635" y="404" fill="#cbd5e1" font-size="10.5" text-anchor="middle">BMP280 / BME280</text>
  <text x="635" y="422" fill="#cbd5e1" font-size="10.5" text-anchor="middle">luchtdruk · hoogte</text>
  <text x="635" y="440" fill="#cbd5e1" font-size="10.5" text-anchor="middle">I2C</text>
  <text x="635" y="462" fill="#86efac" font-size="10" text-anchor="middle">weg van de warmte</text>

  <!-- GNSS -->
  <rect x="640" y="520" width="230" height="120" rx="10" fill="#111827" stroke="#22d3ee" stroke-width="2"/>
  <text x="755" y="546" fill="#67e8f9" font-size="13" font-weight="bold" text-anchor="middle">RTK-GNSS</text>
  <text x="755" y="564" fill="#cbd5e1" font-size="10.5" text-anchor="middle">ZED-F9P-achtig breakout</text>
  <text x="755" y="582" fill="#cbd5e1" font-size="10.5" text-anchor="middle">nauwkeurige positie</text>
  <text x="755" y="600" fill="#cbd5e1" font-size="10.5" text-anchor="middle">UART + eigen antenne</text>
  <text x="755" y="622" fill="#67e8f9" font-size="10" text-anchor="middle">antenne naar boven</text>

  <!-- Expansion connector -->
  <rect x="80" y="520" width="330" height="90" rx="10" fill="#111827" stroke="#f87171" stroke-width="2"/>
  <text x="245" y="546" fill="#fca5a5" font-size="13" font-weight="bold" text-anchor="middle">Uitbreidingsconnector</text>
  <text x="245" y="566" fill="#cbd5e1" font-size="10.5" text-anchor="middle">naar Arduino / voertuigcontroller</text>
  <text x="245" y="586" fill="#cbd5e1" font-size="10.5" text-anchor="middle">UART TX/RX · 5 V · 3,3 V · GND</text>
  <text x="245" y="604" fill="#fca5a5" font-size="10" text-anchor="middle">CSV, regeleinde als terminator</text>

  <!-- TRACES -->
  <!-- VBAT red -->
  <polyline points="295,150 320,150 320,120 340,120" fill="none" stroke="#ef4444" stroke-width="2.5"/>
  <!-- 5V orange trunk -->
  <polyline points="295,190 475,190" fill="none" stroke="#f97316" stroke-width="2.5"/>
  <polyline points="475,190 745,190" fill="none" stroke="#f97316" stroke-width="2.5"/>
  <polyline points="475,190 475,300" fill="none" stroke="#f97316" stroke-width="2.5"/>
  <!-- 3V3 yellow trunk -->
  <polyline points="295,210 320,210 320,500 435,500 435,475" fill="none" stroke="#eab308" stroke-width="2.5"/>
  <polyline points="320,500 635,500 635,475" fill="none" stroke="#eab308" stroke-width="2.5"/>
  <polyline points="320,500 755,500 755,520" fill="none" stroke="#eab308" stroke-width="2.5"/>
  <polyline points="320,470 320,560 245,560" fill="none" stroke="#eab308" stroke-width="2.5"/>
  <!-- I2C blue -->
  <polyline points="475,310 475,345 435,345 435,360" fill="none" stroke="#3b82f6" stroke-width="2.5"/>
  <polyline points="435,345 635,345 635,360" fill="none" stroke="#3b82f6" stroke-width="2.5"/>
  <!-- UART green -->
  <polyline points="610,300 630,300 630,560 640,560" fill="none" stroke="#22c55e" stroke-width="2.5"/>
  <polyline points="352,300 330,300 330,520 340,520" fill="none" stroke="#22c55e" stroke-width="2.5"/>
  <!-- LoRa SPI/control purple -->
  <polyline points="610,160 655,160" fill="none" stroke="#a78bfa" stroke-width="2.5"/>

  <!-- LEGEND -->
  <text x="30" y="745" fill="#334155" font-size="12" font-weight="bold">Legenda</text>
  <g font-size="11.5">
    <line x1="30" y1="770" x2="62" y2="770" stroke="#ef4444" stroke-width="3"/><text x="68" y="774" fill="#334155">VBAT (accu)</text>
    <line x1="175" y1="770" x2="207" y2="770" stroke="#f97316" stroke-width="3"/><text x="213" y="774" fill="#334155">5 V</text>
    <line x1="275" y1="770" x2="307" y2="770" stroke="#eab308" stroke-width="3"/><text x="313" y="774" fill="#334155">3,3 V</text>
    <line x1="390" y1="770" x2="422" y2="770" stroke="#3b82f6" stroke-width="3"/><text x="428" y="774" fill="#334155">I2C</text>
    <line x1="495" y1="770" x2="527" y2="770" stroke="#22c55e" stroke-width="3"/><text x="533" y="774" fill="#334155">UART</text>
    <line x1="610" y1="770" x2="642" y2="770" stroke="#a78bfa" stroke-width="3"/><text x="648" y="774" fill="#334155">LoRa (SPI/control)</text>
    <text x="780" y="774" fill="#64748b">schematisch, niet op schaal</text>
  </g>
</svg>
